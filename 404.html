<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | 404 Error</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* Container Layout */
        .error-container {
            max-width: 550px;
            width: 100%;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Branding logo styling placeholder */
        .brand-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* The 404 Headline */
        h1 {
            font-size: 6rem;
            font-weight: 900;
            line-height: 1;
            color: #3b82f6; /* Modern royal blue */
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 15px;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 30px;
        }

        /* Primary Call to Action */
        .cta-button {
            display: inline-block;
            background-color: #3b82f6;
            color: #ffffff;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }

        .cta-button:hover {
            background-color: #2563eb;
        }

        .cta-button:active {
            transform: scale(0.98);
        }

        /* Helper Quick Links */
        .helpful-links {
            margin-top: 40px;
            border-top: 1px solid #e2e8f0;
            padding-top: 25px;
        }

        .helpful-links p {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .links-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .links-grid a {
            color: #475569;
            font-size: 0.95rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .links-grid a:hover {
            color: #3b82f6;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <!-- Site Branding -->
        <div class="brand-logo">WeSellPC.ca</div>

        <!-- Error Presentation -->
        <h1>404</h1>
        <h2>Oops! Page not found.</h2>
        <p>The link you followed might be broken, or the page may have been moved or permanently deleted. Let's get you back on track!</p>

        <!-- Main Recovery Action -->
        <a href="/" class="cta-button">Back to Homepage</a>

        <!-- Alternate Recovery Paths -->
        <!--div class="helpful-links">
            <p>Or try one of these instead:</p>
            <div class="links-grid">
                <a href="/blog">Our Blog</a>
                <a href="/services">Services</a>
                <a href="/contact">Contact Support</a>
            </div>
        </div-->
    </div>

</body>
</html>
